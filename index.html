<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVTH PROXY</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:#05070d;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* ===== MÀN HÌNH CHÍNH ===== */

.main{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:35px;
    font-weight:900;
    letter-spacing:4px;
    color:#00eaff;
    text-shadow:0 0 15px #00eaff;
}

.start{
    border:1px solid #00eaff;
    background:#07141d;
    color:#00eaff;
    padding:14px 35px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}

/* ===== CHỌN GAME ===== */

.game-box{
    display:none;
    flex-direction:column;
    gap:15px;
    width:280px;
}

.game{
    border:1px solid #00eaff;
    background:#07141d;
    color:white;
    padding:16px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
}

/* ===== AVATAR NỔI ===== */

#floatingAvatar{
    display:none;
    position:fixed;
    left:20px;
    top:200px;
    width:64px;
    height:64px;
    border-radius:50%;
    z-index:9999;

    background:
        radial-gradient(circle at 35% 30%,#ffffff 0 5%,transparent 6%),
        linear-gradient(135deg,#00eaff,#164cff 45%,#8a00ff);

    border:3px solid #00eaff;
    box-shadow:
        0 0 8px #00eaff,
        0 0 25px #0055ff,
        inset 0 0 15px #ffffff44;

    cursor:pointer;
    user-select:none;
    touch-action:none;

    display:none;
    align-items:center;
    justify-content:center;
}

/* mặt/avatar gaming */
.avatar-face{
    width:46px;
    height:46px;
    border-radius:50%;
    background:
        linear-gradient(145deg,#111827,#02040a);
    border:2px solid #ffffffaa;
    position:relative;
    overflow:hidden;
}

.avatar-face::before{
    content:"";
    position:absolute;
    left:7px;
    right:7px;
    top:15px;
    height:7px;
    background:#00eaff;
    border-radius:50%;
    box-shadow:
        0 0 8px #00eaff,
        0 0 15px #00eaff;
}

.avatar-face::after{
    content:"";
    position:absolute;
    left:12px;
    right:12px;
    bottom:8px;
    height:5px;
    border-radius:50%;
    border-bottom:2px solid #00eaff;
}

/* ===== MENU ===== */

#featureMenu{
    display:none;
    position:fixed;
    z-index:9998;

    width:270px;
    left:95px;
    top:180px;

    background:rgba(5,10,20,.96);
    border:1px solid #00eaff;
    border-radius:18px;

    box-shadow:
        0 0 15px #00eaff55,
        0 0 40px #0055ff33;

    overflow:hidden;
    backdrop-filter:blur(12px);
}

.menu-head{
    height:55px;
    display:flex;
    align-items:center;
    padding:0 10px 0 15px;

    background:linear-gradient(
        90deg,
        #071923,
        #0b1024
    );

    border-bottom:1px solid #00eaff44;
}

.user-name{
    flex:1;
    font-weight:900;
    color:#00eaff;
    letter-spacing:1px;
}

.head-btn{
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:#101827;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.head-btn.minus{
    color:#00eaff;
}

.head-btn.close{
    color:#ff3d5a;
    margin-left:6px;
}

/* ===== CHỨC NĂNG ===== */

.feature{
    display:flex;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #ffffff0d;
}

.feature:last-child{
    border-bottom:0;
}

.feature-name{
    flex:1;
    font-weight:bold;
}

.feature-state{
    font-size:11px;
    color:#7c8799;
    margin-right:10px;
}

/* switch */

.switch{
    width:48px;
    height:26px;
    border-radius:20px;
    background:#202838;
    position:relative;
    transition:.2s;
}

.switch::after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#8792a5;
    transition:.2s;
}

.switch.on{
    background:#00a8c7;
    box-shadow:0 0 12px #00eaff88;
}

.switch.on::after{
    left:25px;
    background:white;
}

/* ===== ẨN ===== */

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<div class="main">

    <div class="logo">HVTH PROXY</div>

    <button class="start" onclick="startProxy()">
        BẮT ĐẦU
    </button>

    <div id="gameBox" class="game-box">

        <button class="game" onclick="selectGame('max')">
            FREE FIRE MAX
        </button>

        <button class="game" onclick="selectGame('th')">
            FREE FIRE TH
        </button>

    </div>

</div>


<!-- AVATAR NỔI -->
<div id="floatingAvatar">
    <div class="avatar-face"></div>
</div>


<!-- MENU CHỨC NĂNG -->
<div id="featureMenu">

    <div class="menu-head">

        <div class="user-name">
            hoangthuc
        </div>

        <!-- ĐÓNG MENU NHƯNG GIỮ AVATAR -->
        <button
            class="head-btn minus"
            onclick="closeMenu(event)">
            −
        </button>

        <!-- TẮT TOÀN BỘ -->
        <button
            class="head-btn close"
            onclick="disableAll(event)">
            ×
        </button>

    </div>


    <div class="feature">

        <div class="feature-name">
            Aim neck
        </div>

        <div id="aimState" class="feature-state">
            Đã tắt
        </div>

        <div
            id="aimSwitch"
            class="switch"
            onclick="toggleFeature('aim')">
        </div>

    </div>


    <div class="feature">

        <div class="feature-name">
            Esp moco
        </div>

        <div id="espState" class="feature-state">
            Đã tắt
        </div>

        <div
            id="espSwitch"
            class="switch"
            onclick="toggleFeature('esp')">
        </div>

    </div>

</div>


<script>

const avatar = document.getElementById("floatingAvatar");
const menu = document.getElementById("featureMenu");

let aimEnabled =
    localStorage.getItem("hvth_aim") === "true";

let espEnabled =
    localStorage.getItem("hvth_esp") === "true";

let avatarX =
    Number(localStorage.getItem("hvth_avatar_x")) || 20;

let avatarY =
    Number(localStorage.getItem("hvth_avatar_y")) || 200;


/* =========================
   BẮT ĐẦU
========================= */

function startProxy(){

    document.querySelector(".start").style.display="none";

    document.getElementById("gameBox").style.display="flex";
}


/* =========================
   CHỌN FREE FIRE
========================= */

function selectGame(type){

    document.getElementById("gameBox").style.display="none";

    /*
       CHỈ HIỆN AVATAR.
       MENU KHÔNG TỰ HIỆN.
    */

    avatar.style.display="flex";

    setAvatarPosition();

    menu.style.display="none";
}


/* =========================
   BẤM AVATAR
========================= */

avatar.addEventListener("click",function(){

    if(isDragging) return;

    if(menu.style.display==="block"){

        menu.style.display="none";

    }else{

        menu.style.display="block";

        updateMenuPosition();
    }

});


/* =========================
   ĐÓNG MENU BẰNG DẤU -
========================= */

function closeMenu(e){

    e.stopPropagation();

    menu.style.display="none";
}


/* =========================
   DẤU ×
   TẮT TOÀN BỘ
========================= */

function disableAll(e){

    e.stopPropagation();

    menu.style.display="none";

    avatar.style.display="none";

    aimEnabled=false;
    espEnabled=false;

    localStorage.removeItem("hvth_aim");
    localStorage.removeItem("hvth_esp");

    updateFeatureUI();
}


/* =========================
   AIM / ESP
========================= */

function toggleFeature(type){

    if(type==="aim"){

        aimEnabled=!aimEnabled;

        localStorage.setItem(
            "hvth_aim",
            aimEnabled
        );

    }

    if(type==="esp"){

        espEnabled=!espEnabled;

        localStorage.setItem(
            "hvth_esp",
            espEnabled
        );

    }

    updateFeatureUI();
}


function updateFeatureUI(){

    const aimSwitch =
        document.getElementById("aimSwitch");

    const espSwitch =
        document.getElementById("espSwitch");

    const aimState =
        document.getElementById("aimState");

    const espState =
        document.getElementById("espState");


    aimSwitch.classList.toggle(
        "on",
        aimEnabled
    );

    espSwitch.classList.toggle(
        "on",
        espEnabled
    );


    aimState.textContent =
        aimEnabled
        ? "Đã kích hoạt"
        : "Đã tắt";


    espState.textContent =
        espEnabled
        ? "Đã kích hoạt"
        : "Đã tắt";
}


/* =========================
   VỊ TRÍ AVATAR
========================= */

function setAvatarPosition(){

    const maxX =
        window.innerWidth - avatar.offsetWidth;

    const maxY =
        window.innerHeight - avatar.offsetHeight;

    avatarX =
        Math.max(0,Math.min(avatarX,maxX));

    avatarY =
        Math.max(0,Math.min(avatarY,maxY));

    avatar.style.left =
        avatarX+"px";

    avatar.style.top =
        avatarY+"px";

}


/* =========================
   MENU ĐI THEO AVATAR
========================= */

function updateMenuPosition(){

    const avatarRect =
        avatar.getBoundingClientRect();

    const menuWidth = 270;

    let x =
        avatarRect.right + 10;

    let y =
        avatarRect.top;

    if(x + menuWidth >
       window.innerWidth){

        x =
            avatarRect.left - menuWidth - 10;
    }

    if(x < 5) x=5;

    if(y + 180 >
       window.innerHeight){

        y =
            window.innerHeight - 190;
    }

    if(y < 5) y=5;

    menu.style.left=x+"px";
    menu.style.top=y+"px";
}


/* =========================
   KÉO AVATAR
========================= */

let isDragging=false;
let moved=false;

let startPointerX=0;
let startPointerY=0;

let startAvatarX=0;
let startAvatarY=0;


avatar.addEventListener(
    "pointerdown",
    function(e){

        isDragging=false;
        moved=false;

        startPointerX=e.clientX;
        startPointerY=e.clientY;

        startAvatarX=avatar.offsetLeft;
        startAvatarY=avatar.offsetTop;

        avatar.setPointerCapture(e.pointerId);
    }
);


avatar.addEventListener(
    "pointermove",
    function(e){

        if(
            Math.abs(e.clientX-startPointerX)>5 ||
            Math.abs(e.clientY-startPointerY)>5
        ){

            moved=true;
            isDragging=true;
        }

        if(!moved) return;

        avatarX =
            startAvatarX +
            (e.clientX-startPointerX);

        avatarY =
            startAvatarY +
            (e.clientY-startPointerY);

        setAvatarPosition();

        if(menu.style.display==="block"){
            updateMenuPosition();
        }
    }
);


avatar.addEventListener(
    "pointerup",
    function(){

        localStorage.setItem(
            "hvth_avatar_x",
            avatarX
        );

        localStorage.setItem(
            "hvth_avatar_y",
            avatarY
        );

        setTimeout(function(){
            isDragging=false;
        },50);
    }
);


/* =========================
   XOAY MÀN HÌNH / RESIZE
========================= */

window.addEventListener(
    "resize",
    function(){

        setAvatarPosition();

        if(menu.style.display==="block"){
            updateMenuPosition();
        }
    }
);


/* =========================
   KHỞI TẠO
========================= */

updateFeatureUI();

</script>

</body>
      </html>
