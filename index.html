<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#00d9ff">
<title>HOANGTHUC-PROXY HVTH</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#fff;
    background:#03060b;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(#00d9ff0c 1px,transparent 1px),
      linear-gradient(90deg,#00d9ff0c 1px,transparent 1px);
    background-size:35px 35px;
    animation:gridMove 8s linear infinite;
    pointer-events:none;
}

@keyframes gridMove{
    to{background-position:35px 35px}
}

.container{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    width:90%;
    max-width:380px;
    padding:25px;
    border:1px solid #00d9ff66;
    border-radius:20px;
    background:#06101bee;
    box-shadow:0 0 35px #00d9ff22;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:900;
    color:#00eaff;
    letter-spacing:3px;
    text-shadow:0 0 18px #00eaff;
    margin-bottom:25px;
}

button,input{
    width:100%;
    border-radius:12px;
    font-size:15px;
}

button{
    border:1px solid #00d9ff;
    background:#071721;
    color:#fff;
    padding:14px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.start-btn{
    color:#00eaff;
}

#keyPanel,
#gamePanel{
    display:none;
}

input{
    padding:14px;
    border:1px solid #00d9ff66;
    outline:none;
    background:#02070c;
    color:#fff;
    margin-bottom:12px;
}

input:focus{
    border-color:#00eaff;
    box-shadow:0 0 12px #00eaff33;
}

.get-key{
    margin-bottom:10px;
}

.confirm{
    background:#00a9c7;
    color:#001014;
}

.game{
    margin-top:12px;
    background:#071923;
}

.status{
    min-height:20px;
    margin-top:12px;
    font-size:13px;
    color:#7defff;
}

/* ================= AVATAR ================= */

#floatingAvatar{
    display:none;
    position:fixed;
    left:20px;
    top:200px;

    width:70px;
    height:70px;

    border-radius:50%;
    z-index:9999;

    padding:4px;

    background:linear-gradient(
        135deg,
        #00f0ff,
        #126cff,
        #a000ff
    );

    border:2px solid #00eaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 22px #0077ff,
        0 0 40px #8a00ff66;

    touch-action:none;
    user-select:none;
}

.avatar-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    position:relative;

    background:
        radial-gradient(
            circle at 50% 35%,
            #25304a 0 20%,
            #080b13 21% 60%,
            #020308 61%
        );
}

.avatar-inner:before{
    content:"";
    position:absolute;
    width:48px;
    height:12px;
    left:7px;
    top:23px;

    background:#00eaff;
    border-radius:20px;

    box-shadow:
        0 0 8px #00eaff,
        0 0 18px #00eaff;
}

.avatar-inner:after{
    content:"";
    position:absolute;
    width:35px;
    height:10px;
    left:12px;
    bottom:10px;

    border-bottom:3px solid #00eaff;
    border-radius:50%;
}

/* ================= MENU ================= */

#featureMenu{
    display:none;

    position:fixed;
    z-index:9998;

    width:280px;

    border:1px solid #00eaff;
    border-radius:18px;

    overflow:hidden;

    background:rgba(3,9,17,.97);

    box-shadow:
        0 0 15px #00eaff66,
        0 0 45px #0066ff33;

    backdrop-filter:blur(12px);
}

.menu-header{
    height:58px;
    display:flex;
    align-items:center;

    padding:0 10px 0 16px;

    background:linear-gradient(
        90deg,
        #071a24,
        #101329
    );

    border-bottom:1px solid #00eaff33;
}

.username{
    flex:1;

    font-size:16px;
    font-weight:900;

    color:#00eaff;
}

.menu-btn{
    width:34px;
    height:34px;

    padding:0;

    border:0;
    border-radius:8px;

    background:#111a29;

    font-size:24px;
    line-height:34px;
}

.minus{
    color:#00eaff;
}

.close{
    margin-left:6px;
    color:#ff4161;
}

.feature{
    display:flex;
    align-items:center;

    padding:16px;

    border-bottom:1px solid #ffffff0c;
}

.feature:last-child{
    border-bottom:0;
}

.feature-name{
    flex:1;
    font-weight:bold;
}

.feature-state{
    margin-right:10px;
    font-size:10px;
    color:#78869a;
}

/* switch */

.switch{
    width:48px;
    height:26px;

    position:relative;

    border-radius:20px;

    background:#202a3b;
}

.switch:after{
    content:"";

    position:absolute;

    width:20px;
    height:20px;

    top:3px;
    left:3px;

    border-radius:50%;

    background:#8994a6;

    transition:.2s;
}

.switch.on{
    background:#00aeca;
    box-shadow:0 0 12px #00eaff88;
}

.switch.on:after{
    left:25px;
    background:#fff;
}

/* thông báo */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;

    transform:translateX(-50%) translateY(20px);

    padding:11px 18px;

    border-radius:10px;

    background:#07131d;
    border:1px solid #00eaff;

    color:#00eaff;

    font-size:13px;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:10000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="container">

    <div class="box">

        <div class="logo">
            HVTH PROXY
        </div>

        <!-- BẮT ĐẦU -->
        <div id="startPanel">

            <button
                class="start-btn"
                onclick="startProxy()">
                BẮT ĐẦU
            </button>

        </div>


        <!-- NHẬP KEY -->
        <div id="keyPanel">

            <input
                id="keyInput"
                type="text"
                placeholder="Nhập KEY..."
                autocomplete="off">

            <button
                class="get-key"
                onclick="getKey()">
                GET KEY
            </button>

            <button
                class="confirm"
                onclick="confirmKey()">
                XÁC NHẬN KEY
            </button>

            <div
                id="keyStatus"
                class="status">
            </div>

        </div>


        <!-- CHỌN GAME -->
        <div id="gamePanel">

            <div class="status">
                Chọn phiên bản Free Fire
            </div>

            <button
                class="game"
                onclick="selectGame('MAX')">
                FREE FIRE MAX
            </button>

            <button
                class="game"
                onclick="selectGame('TH')">
                FREE FIRE TH
            </button>

        </div>

    </div>

</div>


<!-- AVATAR NỔI -->

<div id="floatingAvatar">

    <div class="avatar-inner"></div>

</div>


<!-- MENU -->

<div id="featureMenu">

    <div class="menu-header">

        <div class="username">
            hoangthuc
        </div>

        <!-- - CHỈ ĐÓNG MENU -->
        <button
            class="menu-btn minus"
            onclick="closeMenu(event)">
            −
        </button>

        <!-- × TẮT TOÀN BỘ -->
        <button
            class="menu-btn close"
            onclick="closeAll(event)">
            ×
        </button>

    </div>


    <div class="feature">

        <div class="feature-name">
            Aim neck
        </div>

        <div
            id="aimState"
            class="feature-state">
            Đã tắt
        </div>

        <div
            id="aimSwitch"
            class="switch"
            onclick="toggleFeature('aim')">
        </div>

    </div>


    <div class="feature">

        <div class="feature-name">
            Esp moco
        </div>

        <div
            id="espState"
            class="feature-state">
            Đã tắt
        </div>

        <div
            id="espSwitch"
            class="switch"
            onclick="toggleFeature('esp')">
        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   CẤU HÌNH KEY
========================= */

const VALID_KEY = "HVTH-PROXY-7812";

const GET_KEY_URL =
    "https://link4m.org/HPQEIsnw";


/* =========================
   ELEMENT
========================= */

const startPanel =
    document.getElementById("startPanel");

const keyPanel =
    document.getElementById("keyPanel");

const gamePanel =
    document.getElementById("gamePanel");

const keyInput =
    document.getElementById("keyInput");

const keyStatus =
    document.getElementById("keyStatus");

const avatar =
    document.getElementById("floatingAvatar");

const menu =
    document.getElementById("featureMenu");


/* =========================
   TRẠNG THÁI
========================= */

let aimEnabled =
    localStorage.getItem("hvth_aim") === "true";

let espEnabled =
    localStorage.getItem("hvth_esp") === "true";

let avatarX =
    Number(localStorage.getItem("hvth_avatar_x")) || 20;

let avatarY =
    Number(localStorage.getItem("hvth_avatar_y")) || 200;

let isDragging=false;
let moved=false;

let pointerStartX=0;
let pointerStartY=0;

let avatarStartX=0;
let avatarStartY=0;


/* =========================
   BẮT ĐẦU
========================= */

function startProxy(){

    startPanel.style.display="none";

    keyPanel.style.display="block";

}


/* =========================
   GET KEY
========================= */

function getKey(){

    window.open(
        GET_KEY_URL,
        "_blank"
    );

}


/* =========================
   XÁC NHẬN KEY
========================= */

function confirmKey(){

    const key =
        keyInput.value.trim();

    if(key === VALID_KEY){

        localStorage.setItem(
            "hvth_key",
            key
        );

        keyPanel.style.display="none";

        gamePanel.style.display="block";

        showToast(
            "KEY hợp lệ"
        );

    }else{

        keyStatus.textContent =
            "KEY không hợp lệ";

        keyStatus.style.color =
            "#ff4965";

    }

}


/* =========================
   CHỌN GAME
========================= */

function selectGame(type){

    gamePanel.style.display="none";

    /*
       QUAN TRỌNG:
       Chỉ hiện avatar.
       KHÔNG tự mở menu.
    */

    avatar.style.display="flex";

    setAvatarPosition();

    menu.style.display="none";

    showToast(
        "Đã chọn FREE FIRE " + type
    );

}


/* =========================
   BẤM AVATAR
========================= */

avatar.addEventListener(
    "click",
    function(){

        if(isDragging) return;

        if(menu.style.display==="block"){

            menu.style.display="none";

        }else{

            menu.style.display="block";

            updateMenuPosition();

        }

    }
);


/* =========================
   DẤU -
========================= */

function closeMenu(e){

    e.stopPropagation();

    menu.style.display="none";

}


/* =========================
   DẤU ×
========================= */

function closeAll(e){

    e.stopPropagation();

    menu.style.display="none";

    avatar.style.display="none";

    aimEnabled=false;
    espEnabled=false;

    localStorage.removeItem("hvth_aim");
    localStorage.removeItem("hvth_esp");

    updateFeatureUI();

    showToast(
        "Đã tắt toàn bộ"
    );

}


/* =========================
   AIM / ESP
========================= */

function toggleFeature(type){

    if(type==="aim"){

        aimEnabled=!aimEnabled;

        localStorage.setItem(
            "hvth_aim",
            aimEnabled
        );

    }

    if(type==="esp"){

        espEnabled=!espEnabled;

        localStorage.setItem(
            "hvth_esp",
            espEnabled
        );

    }

    updateFeatureUI();

}


function updateFeatureUI(){

    const aimSwitch =
        document.getElementById("aimSwitch");

    const espSwitch =
        document.getElementById("espSwitch");

    const aimState =
        document.getElementById("aimState");

    const espState =
        document.getElementById("espState");


    aimSwitch.classList.toggle(
        "on",
        aimEnabled
    );

    espSwitch.classList.toggle(
        "on",
        espEnabled
    );


    aimState.textContent =
        aimEnabled
        ? "Đã kích hoạt"
        : "Đã tắt";


    espState.textContent =
        espEnabled
        ? "Đã kích hoạt"
        : "Đã tắt";

}


/* =========================
   AVATAR POSITION
========================= */

function setAvatarPosition(){

    const maxX =
        window.innerWidth -
        avatar.offsetWidth;

    const maxY =
        window.innerHeight -
        avatar.offsetHeight;

    avatarX =
        Math.max(
            0,
            Math.min(avatarX,maxX)
        );

    avatarY =
        Math.max(
            0,
            Math.min(avatarY,maxY)
        );

    avatar.style.left =
        avatarX+"px";

    avatar.style.top =
        avatarY+"px";

}


/* =========================
   MENU ĐI THEO AVATAR
========================= */

function updateMenuPosition(){

    const rect =
        avatar.getBoundingClientRect();

    const menuWidth = 280;

    let x =
        rect.right + 10;

    let y =
        rect.top;


    if(
        x + menuWidth >
        window.innerWidth
    ){

        x =
            rect.left -
            menuWidth -
            10;

    }


    if(x < 5){
        x=5;
    }


    if(
        y + 180 >
        window.innerHeight
    ){

        y =
            window.innerHeight -
            190;

    }


    if(y < 5){
        y=5;
    }


    menu.style.left =
        x+"px";

    menu.style.top =
        y+"px";

}


/* =========================
   KÉO AVATAR
========================= */

avatar.addEventListener(
    "pointerdown",
    function(e){

        isDragging=false;
        moved=false;

        pointerStartX =
            e.clientX;

        pointerStartY =
            e.clientY;

        avatarStartX =
            avatar.offsetLeft;

        avatarStartY =
            avatar.offsetTop;

        avatar.setPointerCapture(
            e.pointerId
        );

    }
);


avatar.addEventListener(
    "pointermove",
    function(e){

        const dx =
            e.clientX -
            pointerStartX;

        const dy =
            e.clientY -
            pointerStartY;


        if(
            Math.abs(dx)>5 ||
            Math.abs(dy)>5
        ){

            moved=true;
            isDragging=true;

        }


        if(!moved) return;


        avatarX =
            avatarStartX + dx;

        avatarY =
            avatarStartY + dy;


        setAvatarPosition();


        if(
            menu.style.display==="block"
        ){

            updateMenuPosition();

        }

    }
);


avatar.addEventListener(
    "pointerup",
    function(){

        localStorage.setItem(
            "hvth_avatar_x",
            avatarX
        );

        localStorage.setItem(
            "hvth_avatar_y",
            avatarY
        );


        setTimeout(
            ()=>{
                isDragging=false;
            },
            80
        );

    }
);


/* =========================
   TOAST
========================= */

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent=text;

    toast.classList.add("show");

    setTimeout(
        ()=>{
            toast.classList.remove("show");
        },
        1600
    );

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function(){

        setAvatarPosition();

        if(
            menu.style.display==="block"
        ){

            updateMenuPosition();

        }

    }
);


/* =========================
   KHÔI PHỤC
========================= */

updateFeatureUI();

</script>

</body>
    </html>
