<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HVTH PROXY</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color"
      content="#00d9ff">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    color:white;

    background:
        radial-gradient(
            circle at 50% 30%,
            #123d68 0%,
            #061323 42%,
            #010409 100%
        );
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(0,210,255,.07) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,210,255,.07) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    animation:gridMove 8s linear infinite;

    pointer-events:none;
}

@keyframes gridMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(42px);
    }
}

.glow{
    position:fixed;

    width:320px;
    height:320px;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(0,190,255,.12);

    filter:blur(80px);

    pointer-events:none;
}


/* LOGO */

.logo{
    position:absolute;

    top:38px;

    width:100%;

    text-align:center;

    font-size:31px;

    font-weight:900;

    letter-spacing:5px;

    color:#00d9ff;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px #008cff,
        0 0 50px #0066ff;
}


/* START */

.start{
    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:230px;
    height:70px;

    border-radius:18px;

    border:2px solid #00d9ff;

    background:
        rgba(0,25,50,.85);

    color:white;

    font-size:22px;

    font-weight:bold;

    letter-spacing:2px;

    box-shadow:
        0 0 15px #00d9ff,
        inset 0 0 20px
        rgba(0,217,255,.2);

    cursor:pointer;

    z-index:5;
}

.start:active{
    transform:
        translate(-50%,-50%)
        scale(.95);
}


/* OVERLAY */

.overlay{
    display:none;

    position:fixed;
    inset:0;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(5px);

    z-index:20;
}


/* KEY PANEL */

.panel{
    display:none;

    position:fixed;

    width:90%;
    max-width:410px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    padding:25px;

    border-radius:22px;

    border:1px solid #00d9ff;

    background:
        rgba(3,12,25,.97);

    box-shadow:
        0 0 35px
        rgba(0,217,255,.5);

    z-index:50;
}

.panel h2{
    text-align:center;

    margin-bottom:22px;

    color:#00d9ff;

    letter-spacing:3px;

    text-shadow:
        0 0 15px #00d9ff;
}


/* INPUT */

.key-input{
    width:100%;

    padding:15px;

    border-radius:12px;

    border:1px solid #147ca0;

    outline:none;

    background:#020914;

    color:white;

    font-size:16px;

    margin-bottom:10px;
}

.key-input:focus{
    border-color:#00d9ff;

    box-shadow:
        0 0 12px
        rgba(0,217,255,.5);
}


/* BUTTON */

.btn{
    width:100%;

    padding:14px;

    margin-top:8px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            90deg,
            #0077b6,
            #00c6ff
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}


/* MESSAGE */

.message{
    min-height:24px;

    margin-top:13px;

    text-align:center;

    color:#ff5368;

    font-size:14px;

    font-weight:bold;
}

.success{
    color:#00ffb3;
}


/* GAMES */

.games{
    display:none;
    margin-top:17px;
}

.game{
    width:100%;

    padding:15px;

    margin-top:10px;

    border-radius:13px;

    border:1px solid #00d9ff;

    background:#07192c;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.game:active{
    transform:scale(.97);
}


/* =================================
   MENU NỔI
================================= */

.hoang-menu{

    display:none;

    position:fixed;

    left:50%;
    top:50%;

    width:285px;

    border-radius:20px;

    border:1px solid #00d9ff;

    background:
        rgba(3,12,25,.97);

    box-shadow:
        0 0 25px
        rgba(0,217,255,.55),

        inset 0 0 20px
        rgba(0,150,255,.08);

    z-index:9999;

    overflow:hidden;

    user-select:none;

    animation:menuIn .25s ease;
}

@keyframes menuIn{

    from{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.75);
    }

    to{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* HEADER KÉO */

.menu-header{

    display:flex;

    align-items:center;

    gap:12px;

    padding:14px;

    background:
        linear-gradient(
            135deg,
            #061d35,
            #082d49
        );

    border-bottom:
        1px solid
        rgba(0,217,255,.3);

    cursor:grab;

    touch-action:none;
}

.menu-header:active{
    cursor:grabbing;
}


/* AVATAR */

.avatar{

    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #0077b6,
            #00d9ff
        );

    border:
        2px solid
        #00d9ff;

    color:white;

    font-size:18px;

    font-weight:900;

    box-shadow:
        0 0 15px
        rgba(0,217,255,.7);
}


/* TÊN */

.user-info{
    display:flex;

    flex-direction:column;

    gap:3px;
}

.user-name{

    color:white;

    font-size:17px;

    font-weight:900;

    letter-spacing:1px;
}

.user-sub{

    color:#6edfff;

    font-size:11px;
}


/* NÚT ĐÓNG */

.close-menu{

    margin-left:auto;

    width:30px;
    height:30px;

    border-radius:50%;

    border:1px solid
        rgba(0,217,255,.5);

    background:#06192d;

    color:#00d9ff;

    font-size:16px;

    cursor:pointer;
}


/* BODY MENU */

.menu-body{
    padding:8px 15px 15px;
}


/* FEATURE */

.feature-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:16px 2px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    color:white;

    font-size:16px;

    font-weight:bold;
}


/* SWITCH */

.switch{

    position:relative;

    width:52px;
    height:28px;

    flex-shrink:0;
}

.switch input{
    display:none;
}

.slider{

    position:absolute;

    inset:0;

    border-radius:30px;

    background:#263746;

    border:
        1px solid
        #506777;

    transition:.25s;

    cursor:pointer;
}

.slider::before{

    content:"";

    position:absolute;

    width:20px;
    height:20px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:white;

    transition:.25s;
}

.switch input:checked + .slider{

    background:#00aee8;

    border-color:#00d9ff;

    box-shadow:
        0 0 15px
        #00d9ff;
}

.switch input:checked + .slider::before{

    transform:
        translateX(24px);
}


/* STATUS */

.status{

    min-height:20px;

    padding-top:14px;

    text-align:center;

    color:#00ffb3;

    font-size:13px;

    font-weight:bold;
}

</style>
</head>


<body>


<div class="glow"></div>


<div
    class="logo"
    id="logo">

    HVTH PROXY

</div>


<button
    class="start"
    id="startBtn">

    BẮT ĐẦU

</button>


<div
    class="overlay"
    id="overlay">
</div>


<!-- =========================
     KEY PANEL
========================= -->

<div
    class="panel"
    id="panel">

    <h2>
        HVTH PROXY
    </h2>


    <input
        id="keyInput"
        class="key-input"
        type="text"
        placeholder="Nhập key..."
        autocomplete="off"
    >


    <button
        class="btn"
        id="getKey">

        GET KEY

    </button>


    <button
        class="btn"
        id="checkKey">

        XÁC NHẬN KEY

    </button>


    <div
        class="message"
        id="message">
    </div>


    <div
        class="games"
        id="games">


        <button
            class="game"
            onclick="selectGame('max')">

            🎮 FREE FIRE MAX

        </button>


        <button
            class="game"
            onclick="selectGame('th')">

            🎮 FREE FIRE TH

        </button>


    </div>

</div>


<!-- =========================
     MENU HOANGTHUC
========================= -->

<div
    class="hoang-menu"
    id="hoangMenu">


    <!-- HEADER KÉO ĐƯỢC -->

    <div
        class="menu-header"
        id="dragHeader">


        <div class="avatar">
            H
        </div>


        <div class="user-info">

            <div class="user-name">
                hoangthuc
            </div>

            <div class="user-sub">
                HVTH PROXY
            </div>

        </div>


        <button
            class="close-menu"
            id="closeMenu">

            ×

        </button>

    </div>


    <!-- CHỨC NĂNG -->

    <div class="menu-body">


        <div class="feature-row">

            <span>
                Aim neck
            </span>


            <label class="switch">

                <input
                    type="checkbox"
                    id="aimNeck">

                <span class="slider"></span>

            </label>

        </div>


        <div class="feature-row">

            <span>
                Esp moco
            </span>


            <label class="switch">

                <input
                    type="checkbox"
                    id="espMoco">

                <span class="slider"></span>

            </label>

        </div>


        <div
            class="status"
            id="status">
        </div>


    </div>

</div>


<script>

/* =========================
   CONFIG
========================= */

const VALID_KEY =
    "HVTH-PROXY-7812";

const GET_KEY_URL =
    "https://link4m.org/HPQEIsnw";


/* =========================
   ELEMENTS
========================= */

const startBtn =
    document.getElementById("startBtn");

const logo =
    document.getElementById("logo");

const panel =
    document.getElementById("panel");

const overlay =
    document.getElementById("overlay");

const keyInput =
    document.getElementById("keyInput");

const getKey =
    document.getElementById("getKey");

const checkKey =
    document.getElementById("checkKey");

const message =
    document.getElementById("message");

const games =
    document.getElementById("games");

const hoangMenu =
    document.getElementById("hoangMenu");

const dragHeader =
    document.getElementById("dragHeader");

const closeMenu =
    document.getElementById("closeMenu");

const aimNeck =
    document.getElementById("aimNeck");

const espMoco =
    document.getElementById("espMoco");

const status =
    document.getElementById("status");


/* =========================
   START
========================= */

startBtn.onclick =
function(){

    logo.style.display =
        "none";

    startBtn.style.display =
        "none";

    openPanel();

};


/* =========================
   OPEN PANEL
========================= */

function openPanel(){

    panel.style.display =
        "block";

    overlay.style.display =
        "block";


    const savedKey =
        localStorage.getItem(
            "hvth_key"
        );


    if(savedKey === VALID_KEY){

        keyInput.value =
            savedKey;

        games.style.display =
            "block";

        message.className =
            "message success";

        message.innerHTML =
            "KEY HỢP LỆ";

    }

}


/* =========================
   CLOSE KEY PANEL
========================= */

overlay.onclick =
function(){

    panel.style.display =
        "none";

    overlay.style.display =
        "none";

};


/* =========================
   GET KEY
========================= */

getKey.onclick =
function(){

    window.location.href =
        GET_KEY_URL;

};


/* =========================
   CHECK KEY
========================= */

checkKey.onclick =
function(){

    const key =
        keyInput.value.trim();


    if(key === VALID_KEY){

        localStorage.setItem(
            "hvth_key",
            key
        );


        message.className =
            "message success";


        message.innerHTML =
            "KEY HỢP LỆ";


        games.style.display =
            "block";

    }else{

        localStorage.removeItem(
            "hvth_key"
        );


        games.style.display =
            "none";


        message.className =
            "message";


        message.innerHTML =
            "KEY KHÔNG ĐÚNG HOẶC ĐÃ HẾT HẠN";

    }

};


/* =========================
   CHỌN FREE FIRE
========================= */

function selectGame(type){

    /*
       Chỉ sau khi bấm
       Free Fire mới hiện menu.
    */

    panel.style.display =
        "none";

    overlay.style.display =
        "none";


    hoangMenu.style.display =
        "block";


    loadSettings();

}


/* =========================
   ĐÓNG MENU
========================= */

closeMenu.onclick =
function(event){

    event.stopPropagation();

    hoangMenu.style.display =
        "none";

};


/* =========================
   AIM NECK
========================= */

aimNeck.onchange =
function(){

    if(this.checked){

        localStorage.setItem(
            "aim_neck",
            "on"
        );

        status.innerHTML =
            "Đã kích hoạt chức năng Aim neck";

    }else{

        localStorage.setItem(
            "aim_neck",
            "off"
        );

        status.innerHTML =
            "Đã tắt chức năng Aim neck";

    }

};


/* =========================
   ESP MOCO
========================= */

espMoco.onchange =
function(){

    if(this.checked){

        localStorage.setItem(
            "esp_moco",
            "on"
        );

        status.innerHTML =
            "Đã kích hoạt chức năng Esp moco";

    }else{

        localStorage.setItem(
            "esp_moco",
            "off"
        );

        status.innerHTML =
            "Đã tắt chức năng Esp moco";

    }

};


/* =========================
   LOAD SETTINGS
========================= */

function loadSettings(){

    aimNeck.checked =
        localStorage.getItem(
            "aim_neck"
        ) === "on";


    espMoco.checked =
        localStorage.getItem(
            "esp_moco"
        ) === "on";

}


/* =========================
   KÉO MENU BẰNG CHUỘT
========================= */

let dragging = false;

let offsetX = 0;
let offsetY = 0;


dragHeader.addEventListener(
    "mousedown",
    startDrag
);


document.addEventListener(
    "mousemove",
    drag
);


document.addEventListener(
    "mouseup",
    stopDrag
);


/* =========================
   KÉO MENU CẢM ỨNG
========================= */

dragHeader.addEventListener(
    "touchstart",
    startTouch,
    {passive:false}
);


document.addEventListener(
    "touchmove",
    moveTouch,
    {passive:false}
);


document.addEventListener(
    "touchend",
    stopDrag
);


/* =========================
   MOUSE DRAG
========================= */

function startDrag(e){

    if(e.target === closeMenu){
        return;
    }


    dragging = true;


    const rect =
        hoangMenu.getBoundingClientRect();


    offsetX =
        e.clientX - rect.left;

    offsetY =
        e.clientY - rect.top;


    hoangMenu.style.left =
        rect.left + "px";

    hoangMenu.style.top =
        rect.top + "px";

    hoangMenu.style.transform =
        "none";
}


function drag(e){

    if(!dragging){
        return;
    }


    moveMenu(
        e.clientX,
        e.clientY
    );

}


function stopDrag(){

    dragging = false;

}


/* =========================
   TOUCH DRAG
========================= */

function startTouch(e){

    if(e.target === closeMenu){
        return;
    }


    e.preventDefault();


    dragging = true;


    const touch =
        e.touches[0];

    const rect =
        hoangMenu.getBoundingClientRect();


    offsetX =
        touch.clientX - rect.left;

    offsetY =
        touch.clientY - rect.top;


    hoangMenu.style.left =
        rect.left + "px";

    hoangMenu.style.top =
        rect.top + "px";

    hoangMenu.style.transform =
        "none";
}


function moveTouch(e){

    if(!dragging){
        return;
    }


    e.preventDefault();


    const touch =
        e.touches[0];


    moveMenu(
        touch.clientX,
        touch.clientY
    );

}


/* =========================
   DI CHUYỂN MENU
========================= */

function moveMenu(x,y){

    let newX =
        x - offsetX;

    let newY =
        y - offsetY;


    const width =
        hoangMenu.offsetWidth;

    const height =
        hoangMenu.offsetHeight;


    const maxX =
        window.innerWidth - width;

    const maxY =
        window.innerHeight - height;


    /*
       Không cho menu
       kéo ra ngoài màn hình.
    */

    newX =
        Math.max(
            0,
            Math.min(
                newX,
                maxX
            )
        );


    newY =
        Math.max(
            0,
            Math.min(
                newY,
                maxY
            )
        );


    hoangMenu.style.left =
        newX + "px";

    hoangMenu.style.top =
        newY + "px";

}


/* =========================
   LƯU VỊ TRÍ MENU
========================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            hoangMenu.style.display
            === "block"
        ){

            localStorage.setItem(
                "menu_x",
                hoangMenu.offsetLeft
            );

            localStorage.setItem(
                "menu_y",
                hoangMenu.offsetTop
            );

        }

    }
);


/* =========================
   KHÔI PHỤC VỊ TRÍ
========================= */

function loadMenuPosition(){

    const x =
        localStorage.getItem(
            "menu_x"
        );

    const y =
        localStorage.getItem(
            "menu_y"
        );


    if(x !== null && y !== null){

        hoangMenu.style.left =
            x + "px";

        hoangMenu.style.top =
            y + "px";

        hoangMenu.style.transform =
            "none";

    }

}


loadMenuPosition();

</script>

</body>
      </html>
