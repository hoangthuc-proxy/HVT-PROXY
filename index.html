<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>HOANGTHUC-PROXY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
}

/* =========================
   BACKGROUND
========================= */

body{
    background:
        linear-gradient(
            135deg,
            rgba(0,0,0,.45),
            rgba(0,20,40,.25)
        ),
        url("bg.png") center/cover no-repeat fixed;
}

/* lớp tối */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0,0,0,.72) 100%
        );
    pointer-events:none;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#030303;
    transition:.8s;
}

.loading-title{
    font-size:28px;
    font-weight:900;
    letter-spacing:3px;
    color:#00d9ff;
    text-shadow:
        0 0 10px #00d9ff,
        0 0 30px #0077ff;
}

.loading-line{
    width:180px;
    height:3px;
    margin-top:20px;
    background:#111;
    overflow:hidden;
    border-radius:20px;
}

.loading-line::after{
    content:"";
    display:block;
    width:50%;
    height:100%;
    background:#00d9ff;
    box-shadow:0 0 15px #00d9ff;
    animation:load 1s infinite;
}

@keyframes load{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(300%)}
}

/* =========================
   MAIN
========================= */

#app{
    position:relative;
    width:100%;
    height:100%;
    opacity:0;
    transform:scale(1.05);
    transition:1s;
}

#app.show{
    opacity:1;
    transform:scale(1);
}

/* =========================
   HEADER
========================= */

.header{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    text-align:center;
    z-index:10;
}

.logo{
    font-size:25px;
    font-weight:1000;
    letter-spacing:2px;
    color:white;
    text-shadow:
        0 0 5px #00d9ff,
        0 0 15px #00aaff,
        0 0 35px #0066ff;
}

.sub{
    margin-top:5px;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
    color:#00d9ff;
}

/* =========================
   MAIN CARD
========================= */

.main-card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(88%,380px);
    padding:25px;
    border:1px solid rgba(0,217,255,.5);
    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(0,0,0,.72),
            rgba(0,35,60,.5)
        );

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 15px rgba(0,180,255,.35),
        inset 0 0 30px rgba(0,140,255,.08);

    transition:.5s;
}

.main-card:hover{
    box-shadow:
        0 0 30px rgba(0,200,255,.55),
        inset 0 0 30px rgba(0,140,255,.15);
}

.card-title{
    text-align:center;
    font-size:19px;
    font-weight:900;
    margin-bottom:18px;
}

/* =========================
   KEY INPUT
========================= */

.key-input{
    width:100%;
    height:52px;
    border:1px solid #00cfff;
    outline:none;
    border-radius:12px;
    background:rgba(0,0,0,.65);
    color:white;
    text-align:center;
    font-size:15px;
    font-weight:bold;

    box-shadow:
        inset 0 0 10px rgba(0,180,255,.1),
        0 0 10px rgba(0,180,255,.15);

    transition:.3s;
}

.key-input:focus{
    border-color:#fff;
    box-shadow:
        0 0 15px #00cfff,
        inset 0 0 15px rgba(0,200,255,.15);
}

.key-input::placeholder{
    color:#777;
}

/* =========================
   BUTTON
========================= */

.btn{
    width:100%;
    height:50px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;

    color:white;
    font-size:15px;
    font-weight:900;
    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #006eff,
            #00cfff,
            #006eff
        );

    background-size:200% 100%;

    box-shadow:
        0 0 15px rgba(0,180,255,.45);

    transition:.3s;
}

.btn:active{
    transform:scale(.94);
}

.btn:hover{
    background-position:100% 0;
    box-shadow:
        0 0 25px rgba(0,210,255,.7);
}

/* =========================
   GAME SELECT
========================= */

.game-select{
    display:none;
    margin-top:18px;
    animation:slideUp .5s ease;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.select-title{
    font-size:12px;
    text-align:center;
    color:#aaa;
    margin-bottom:10px;
}

.game{
    width:100%;
    padding:15px;
    margin-top:10px;

    border:1px solid rgba(0,210,255,.4);
    border-radius:12px;

    background:rgba(0,0,0,.55);

    color:white;
    font-weight:900;

    cursor:pointer;
    transition:.3s;
}

.game:hover{
    border-color:#00d9ff;
    box-shadow:0 0 15px rgba(0,210,255,.4);
}

.game.selected{
    background:
        linear-gradient(
            90deg,
            rgba(0,110,255,.4),
            rgba(0,210,255,.2)
        );

    border-color:#00d9ff;
    box-shadow:
        0 0 15px rgba(0,210,255,.5);
}

/* =========================
   MENU
========================= */

#menu{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.8);

    width:min(90%,400px);

    padding:20px;

    opacity:0;
    visibility:hidden;

    border-radius:20px;
    border:1px solid #00d9ff;

    background:
        linear-gradient(
            145deg,
            rgba(0,0,0,.88),
            rgba(0,30,55,.8)
        );

    backdrop-filter:blur(15px);

    box-shadow:
        0 0 30px rgba(0,190,255,.5);

    transition:.4s;

    z-index:100;
}

#menu.active{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,-50%) scale(1);
}

.menu-header{
    text-align:center;
    margin-bottom:15px;
}

.menu-header h2{
    font-size:22px;
    color:#00d9ff;
    text-shadow:0 0 15px #00d9ff;
}

.menu-header p{
    margin-top:5px;
    font-size:10px;
    color:#888;
    letter-spacing:1px;
}

/* =========================
   MENU ITEM
========================= */

.menu-item{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:10px;
    padding:14px;

    border-radius:12px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);

    transition:.3s;
}

.menu-item:hover{
    border-color:#00d9ff;
    box-shadow:0 0 15px rgba(0,210,255,.25);
}

.item-name{
    font-size:14px;
    font-weight:900;
}

.item-status{
    font-size:10px;
    color:#00eaff;
}

/* =========================
   SWITCH
========================= */

.switch{
    position:relative;
    width:45px;
    height:23px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#222;
    border-radius:30px;
    border:1px solid #555;
    transition:.3s;
}

.slider::before{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    left:2px;
    top:2px;

    background:white;
    border-radius:50%;

    transition:.3s;
}

.switch input:checked + .slider{
    background:#006eff;
    border-color:#00d9ff;
    box-shadow:0 0 10px #00cfff;
}

.switch input:checked + .slider::before{
    transform:translateX(21px);
}

/* =========================
   CLOSE MENU
========================= */

.close-menu{
    width:100%;
    height:45px;
    margin-top:15px;

    border:none;
    border-radius:10px;

    background:#111;
    border:1px solid #333;

    color:white;
    font-weight:900;

    cursor:pointer;
}

.close-menu:active{
    transform:scale(.95);
}

/* =========================
   OPEN MENU BUTTON
========================= */

#openMenu{
    display:none;

    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);

    width:180px;
    height:48px;

    border:none;
    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            #005cff,
            #00cfff
        );

    color:white;
    font-weight:900;
    letter-spacing:1px;

    box-shadow:
        0 0 20px rgba(0,190,255,.5);

    z-index:20;
}

#openMenu:active{
    transform:translateX(-50%) scale(.94);
}

/* =========================
   NOTIFICATION
========================= */

#notice{
    position:fixed;
    top:20px;
    left:50%;
    transform:translate(-50%,-100px);

    min-width:240px;
    padding:13px 18px;

    border-radius:12px;
    border:1px solid #00d9ff;

    background:rgba(0,10,20,.92);

    color:white;
    text-align:center;
    font-size:12px;
    font-weight:bold;

    box-shadow:0 0 20px rgba(0,200,255,.4);

    opacity:0;
    transition:.4s;

    z-index:99999;
}

#notice.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   TRANSITION
========================= */

#transition{
    position:fixed;
    inset:0;
    z-index:9998;

    background:#000;

    opacity:0;
    visibility:hidden;

    transition:.5s;
}

#transition.active{
    opacity:1;
    visibility:visible;
}

/* =========================
   PARTICLES
========================= */

.particle{
    position:fixed;
    width:3px;
    height:3px;
    background:#00d9ff;
    border-radius:50%;
    box-shadow:0 0 10px #00d9ff;

    pointer-events:none;

    animation:particleMove linear infinite;
}

@keyframes particleMove{
    from{
        transform:translateY(110vh);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
    <div class="loading-title">
        HOANGTHUC-PROXY
    </div>

    <div class="loading-line"></div>
</div>

<!-- TRANSITION -->
<div id="transition"></div>

<!-- NOTICE -->
<div id="notice"></div>

<!-- APP -->
<div id="app">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            HOANGTHUC-PROXY
        </div>

        <div class="sub">
            AIMBOT 100% • ESP BOX RED
        </div>
    </div>


    <!-- MAIN -->
    <div class="main-card">

        <div class="card-title">
            XÁC THỰC KEY
        </div>

        <input
            id="keyInput"
            class="key-input"
            type="text"
            placeholder="NHẬP KEY..."
            autocomplete="off"
        >

        <button
            class="btn"
            onclick="verifyKey()"
        >
            XÁC NHẬN KEY
        </button>


        <!-- GAME SELECT -->
        <div
            id="gameSelect"
            class="game-select"
        >

            <div class="select-title">
                CHỌN PHIÊN BẢN GAME
            </div>

            <div
                class="game"
                onclick="selectGame(this,'Free Fire MAX')"
            >
                FREE FIRE MAX
            </div>

            <div
                class="game"
                onclick="selectGame(this,'Free Fire TH')"
            >
                FREE FIRE TH
            </div>

            <button
                class="btn"
                onclick="enterGame()"
            >
                TIẾP TỤC
            </button>

        </div>

    </div>


    <!-- OPEN MENU -->
    <button
        id="openMenu"
        onclick="openMenu()"
    >
        MỞ MENU
    </button>


    <!-- MENU -->
    <div id="menu">

        <div class="menu-header">

            <h2>
                HOANGTHUC MENU
            </h2>

            <p>
                FREE FIRE • HOANGTHUC
            </p>

        </div>


        <div class="menu-item">

            <div>
                <div class="item-name">
                    AIMBOT 100%
                </div>

                <div class="item-status">
                    HOANGTHUC
                </div>
            </div>

            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>

        </div>


        <div class="menu-item">

            <div>
                <div class="item-name">
                    ESP BOX RED
                </div>

                <div class="item-status">
                    HOANGTHUC
                </div>
            </div>

            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>

        </div>


        <div class="menu-item">

            <div>
                <div class="item-name">
                    FPS BOOST
                </div>

                <div class="item-status">
                    PERFORMANCE
                </div>
            </div>

            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>

        </div>


        <div class="menu-item">

            <div>
                <div class="item-name">
                    GIAO DIỆN NEON
                </div>

                <div class="item-status">
                    VISUAL
                </div>
            </div>

            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>

        </div>


        <button
            class="close-menu"
            onclick="closeMenu()"
        >
            TẮT MENU
        </button>

    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let selectedGame = null;


/* =========================
   LOADING
========================= */

window.addEventListener("load", () => {

    setTimeout(() => {

        document.getElementById("loading").style.opacity = "0";

        setTimeout(() => {

            document.getElementById("loading").style.display = "none";

            document
                .getElementById("app")
                .classList.add("show");

        },700);

    },1000);

});


/* =========================
   NOTICE
========================= */

function notice(text){

    const box =
        document.getElementById("notice");

    box.textContent = text;

    box.classList.add("show");

    setTimeout(() => {

        box.classList.remove("show");

    },2200);
}


/* =========================
   TRANSITION
========================= */

function transition(callback){

    const layer =
        document.getElementById("transition");

    layer.classList.add("active");

    setTimeout(() => {

        callback();

        setTimeout(() => {

            layer.classList.remove("active");

        },250);

    },500);
}


/* =========================
   VERIFY KEY
========================= */

function verifyKey(){

    const key =
        document
        .getElementById("keyInput")
        .value
        .trim();

    if(!key){

        notice("VUI LÒNG NHẬP KEY");

        return;
    }

    transition(() => {

        document
            .getElementById("gameSelect")
            .style.display = "block";

        notice("KEY ĐÃ ĐƯỢC XÁC NHẬN");

    });

}


/* =========================
   SELECT GAME
========================= */

function selectGame(element,game){

    document
        .querySelectorAll(".game")
        .forEach(el =>
            el.classList.remove("selected")
        );

    element.classList.add("selected");

    selectedGame = game;

    notice("ĐÃ CHỌN " + game.toUpperCase());
}


/* =========================
   ENTER GAME
========================= */

function enterGame(){

    if(!selectedGame){

        notice("HÃY CHỌN FREE FIRE");

        return;
    }

    transition(() => {

        document
            .querySelector(".main-card")
            .classList.add("hidden");

        document
            .getElementById("openMenu")
            .style.display = "block";

        notice(
            selectedGame.toUpperCase()
            + " ĐÃ ĐƯỢC CHỌN"
        );

    });

}


/* =========================
   OPEN MENU
========================= */

function openMenu(){

    document
        .getElementById("menu")
        .classList.add("active");

}


/* =========================
   CLOSE MENU
========================= */

function closeMenu(){

    document
        .getElementById("menu")
        .classList.remove("active");

}


/* =========================
   PARTICLES
========================= */

function createParticles(){

    for(let i=0;i<35;i++){

        const p =
            document.createElement("div");

        p.className = "particle";

        p.style.left =
            Math.random()*100 + "%";

        p.style.animationDuration =
            (4 + Math.random()*7) + "s";

        p.style.animationDelay =
            Math.random()*5 + "s";

        document.body.appendChild(p);
    }

}

createParticles();

</script>

</body>
            </html>
