<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HVTH PROXY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    color:white;
    background:
        radial-gradient(circle at 50% 30%,#123d68 0%,#061323 42%,#010409 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,210,255,.07) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,210,255,.07) 1px,transparent 1px);
    background-size:42px 42px;
    animation:gridMove 8s linear infinite;
    pointer-events:none;
}

@keyframes gridMove{
    from{transform:translateY(0)}
    to{transform:translateY(42px)}
}

.glow{
    position:fixed;
    width:320px;
    height:320px;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(0,190,255,.12);
    filter:blur(80px);
}

.logo{
    position:absolute;
    top:38px;
    width:100%;
    text-align:center;
    font-size:31px;
    font-weight:900;
    letter-spacing:5px;
    color:#00d9ff;
    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px #008cff,
        0 0 50px #0066ff;
}

.start{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:230px;
    height:70px;
    border-radius:18px;
    border:2px solid #00d9ff;
    background:rgba(0,25,50,.85);
    color:white;
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:
        0 0 15px #00d9ff,
        inset 0 0 20px rgba(0,217,255,.2);
}

.start:active{
    transform:translate(-50%,-50%) scale(.95);
}

.float{
    display:none;
    position:fixed;
    right:22px;
    bottom:25px;
    width:65px;
    height:65px;
    border-radius:50%;
    border:2px solid #00d9ff;
    background:#06192d;
    color:#00d9ff;
    font-size:27px;
    box-shadow:0 0 20px #00d9ff;
    z-index:100;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
    z-index:20;
}

.panel{
    display:none;
    position:fixed;
    width:90%;
    max-width:410px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:25px;
    border-radius:22px;
    border:1px solid #00d9ff;
    background:rgba(3,12,25,.97);
    box-shadow:
        0 0 35px rgba(0,217,255,.5),
        inset 0 0 25px rgba(0,150,255,.08);
    z-index:50;
}

.panel h2{
    text-align:center;
    margin-bottom:22px;
    color:#00d9ff;
    letter-spacing:3px;
    text-shadow:0 0 15px #00d9ff;
}

.key-input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #147ca0;
    outline:none;
    background:#020914;
    color:white;
    font-size:16px;
    margin-bottom:10px;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#0077b6,#00c6ff);
    color:white;
    font-size:16px;
    font-weight:bold;
}

.message{
    min-height:24px;
    margin-top:13px;
    text-align:center;
    color:#ff5368;
    font-size:14px;
    font-weight:bold;
}

.success{
    color:#00ffb3;
}

.games{
    display:none;
    margin-top:17px;
}

.game{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:13px;
    border:1px solid #00d9ff;
    background:#07192c;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.feature-menu{
    display:none;
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid rgba(0,217,255,.3);
}

.feature{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 5px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.feature-name{
    font-size:17px;
    font-weight:bold;
}

.switch{
    position:relative;
    width:52px;
    height:28px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    border-radius:30px;
    background:#263746;
    border:1px solid #4c6575;
    transition:.25s;
}

.slider::before{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#fff;
    transition:.25s;
}

.switch input:checked + .slider{
    background:#00aee8;
    box-shadow:0 0 15px #00d9ff;
}

.switch input:checked + .slider::before{
    transform:translateX(24px);
}

.status{
    min-height:25px;
    margin-top:17px;
    text-align:center;
    color:#00ffb3;
    font-weight:bold;
    font-size:14px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="logo" id="logo">
    HVTH PROXY
</div>

<button class="start" id="startBtn">
    BẮT ĐẦU
</button>

<button class="float" id="floatBtn">
    ☰
</button>

<div class="overlay" id="overlay"></div>

<div class="panel" id="panel">

    <h2>HVTH PROXY</h2>

    <input
        id="keyInput"
        class="key-input"
        type="text"
        placeholder="Nhập key..."
        autocomplete="off"
    >

    <button class="btn" id="getKey">
        GET KEY
    </button>

    <button class="btn" id="checkKey">
        XÁC NHẬN KEY
    </button>

    <div class="message" id="message"></div>

    <div class="games" id="games">

        <button class="game" onclick="openGame('max')">
            🎮 FREE FIRE MAX
        </button>

        <button class="game" onclick="openGame('th')">
            🎮 FREE FIRE TH
        </button>

        <div class="feature-menu" id="featureMenu">

            <div class="feature">
                <span class="feature-name">Aim neck</span>

                <label class="switch">
                    <input type="checkbox" id="aimNeck">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="feature">
                <span class="feature-name">Esp moco</span>

                <label class="switch">
                    <input type="checkbox" id="espMoco">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="status" id="status">
            </div>

        </div>

    </div>

</div>

<script>

const VALID_KEY = "HVTH-PROXY-7812";

const GET_KEY_URL =
"https://link4m.org/HPQEIsnw";

const startBtn =
document.getElementById("startBtn");

const floatBtn =
document.getElementById("floatBtn");

const logo =
document.getElementById("logo");

const panel =
document.getElementById("panel");

const overlay =
document.getElementById("overlay");

const keyInput =
document.getElementById("keyInput");

const getKey =
document.getElementById("getKey");

const checkKey =
document.getElementById("checkKey");

const message =
document.getElementById("message");

const games =
document.getElementById("games");

const featureMenu =
document.getElementById("featureMenu");

const aimNeck =
document.getElementById("aimNeck");

const espMoco =
document.getElementById("espMoco");

const status =
document.getElementById("status");


/* BẮT ĐẦU */

startBtn.onclick = function(){

    logo.style.display = "none";
    startBtn.style.display = "none";

    floatBtn.style.display = "block";

    openPanel();
};


/* MENU NỔI */

floatBtn.onclick = function(){
    openPanel();
};


/* MỞ PANEL */

function openPanel(){

    panel.style.display = "block";
    overlay.style.display = "block";

    const savedKey =
    localStorage.getItem("hvth_key");

    if(savedKey === VALID_KEY){

        keyInput.value = savedKey;

        games.style.display = "block";

        message.className =
        "message success";

        message.innerHTML =
        "KEY HỢP LỆ";

    }else{

        games.style.display = "none";
        featureMenu.style.display = "none";

        message.className = "message";
        message.innerHTML = "";
    }

    loadFeatures();
}


/* ĐÓNG PANEL */

overlay.onclick = function(){

    panel.style.display = "none";
    overlay.style.display = "none";

};


/* GET KEY */

getKey.onclick = function(){

    window.location.href =
    GET_KEY_URL;

};


/* CHECK KEY */

checkKey.onclick = function(){

    const key =
    keyInput.value.trim();

    if(key === VALID_KEY){

        localStorage.setItem(
            "hvth_key",
            key
        );

        message.className =
        "message success";

        message.innerHTML =
        "KEY HỢP LỆ";

        games.style.display =
        "block";

    }else{

        localStorage.removeItem(
            "hvth_key"
        );

        games.style.display =
        "none";

        featureMenu.style.display =
        "none";

        message.className =
        "message";

        message.innerHTML =
        "KEY KHÔNG ĐÚNG HOẶC ĐÃ HẾT HẠN";
    }

};


/* CHỌN FREE FIRE */

function openGame(type){

    featureMenu.style.display = "block";

    status.innerHTML =
    "Đã mở menu chức năng";

    /*
      Chỉ mở menu giao diện.
      Không can thiệp vào Free Fire.
    */
}


/* AIM NECK */

aimNeck.onchange = function(){

    if(this.checked){

        localStorage.setItem(
            "aim_neck",
            "on"
        );

        status.innerHTML =
        "Đã kích hoạt chức năng Aim neck";

    }else{

        localStorage.setItem(
            "aim_neck",
            "off"
        );

        status.innerHTML =
        "Đã tắt chức năng Aim neck";
    }
};


/* ESP MOCO */

espMoco.onchange = function(){

    if(this.checked){

        localStorage.setItem(
            "esp_moco",
            "on"
        );

        status.innerHTML =
        "Đã kích hoạt chức năng Esp moco";

    }else{

        localStorage.setItem(
            "esp_moco",
            "off"
        );

        status.innerHTML =
        "Đã tắt chức năng Esp moco";
    }
};


/* KHÔI PHỤC TRẠNG THÁI */

function loadFeatures(){

    const aim =
    localStorage.getItem("aim_neck");

    const esp =
    localStorage.getItem("esp_moco");

    aimNeck.checked =
    aim === "on";

    espMoco.checked =
    esp === "on";

}

</script>

</body>
    </html>
