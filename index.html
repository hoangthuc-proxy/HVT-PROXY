<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HVTH PROXY</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color"
      content="#00d9ff">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    overflow:hidden;

    color:white;

    background:
        radial-gradient(
            circle at 50% 30%,
            #123d68 0%,
            #061323 42%,
            #010409 100%
        );
}


/* =========================
   GRID
========================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            rgba(0,210,255,.07) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,210,255,.07) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    animation:gridMove 8s linear infinite;

    pointer-events:none;
}

@keyframes gridMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(42px);
    }

}


/* =========================
   GLOW
========================= */

.glow{

    position:fixed;

    width:320px;
    height:320px;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(0,190,255,.12);

    filter:blur(80px);

    pointer-events:none;
}


/* =========================
   LOGO
========================= */

.logo{

    position:absolute;

    top:38px;

    width:100%;

    text-align:center;

    font-size:31px;

    font-weight:900;

    letter-spacing:5px;

    color:#00d9ff;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px #008cff,
        0 0 50px #0066ff;
}


/* =========================
   START BUTTON
========================= */

.start{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:230px;
    height:70px;

    border-radius:18px;

    border:2px solid #00d9ff;

    background:
        rgba(0,25,50,.85);

    color:white;

    font-size:22px;

    font-weight:bold;

    letter-spacing:2px;

    box-shadow:
        0 0 15px #00d9ff,
        inset 0 0 20px
        rgba(0,217,255,.2);

    cursor:pointer;

    z-index:5;
}

.start:active{

    transform:
        translate(-50%,-50%)
        scale(.95);
}


/* =========================
   FLOAT MENU BUTTON
========================= */

.float{

    display:none;

    position:fixed;

    right:22px;
    bottom:25px;

    width:65px;
    height:65px;

    border-radius:50%;

    border:2px solid #00d9ff;

    background:#06192d;

    color:#00d9ff;

    font-size:27px;

    box-shadow:
        0 0 20px #00d9ff;

    cursor:pointer;

    z-index:1000;

    animation:floatIn .35s ease;
}

@keyframes floatIn{

    from{

        opacity:0;

        transform:
            scale(0)
            rotate(-180deg);

    }

    to{

        opacity:1;

        transform:
            scale(1)
            rotate(0);

    }

}


/* =========================
   OVERLAY
========================= */

.overlay{

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(5px);

    z-index:20;
}


/* =========================
   KEY PANEL
========================= */

.panel{

    display:none;

    position:fixed;

    width:90%;

    max-width:410px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    padding:25px;

    border-radius:22px;

    border:1px solid #00d9ff;

    background:
        rgba(3,12,25,.97);

    box-shadow:
        0 0 35px
        rgba(0,217,255,.5),

        inset 0 0 25px
        rgba(0,150,255,.08);

    z-index:50;

    animation:panelIn .25s ease;
}

@keyframes panelIn{

    from{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.8);

    }

    to{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);

    }

}


.panel h2{

    text-align:center;

    margin-bottom:22px;

    color:#00d9ff;

    letter-spacing:3px;

    text-shadow:
        0 0 15px #00d9ff;
}


/* =========================
   INPUT
========================= */

.key-input{

    width:100%;

    padding:15px;

    border-radius:12px;

    border:1px solid #147ca0;

    outline:none;

    background:#020914;

    color:white;

    font-size:16px;

    margin-bottom:10px;
}

.key-input:focus{

    border-color:#00d9ff;

    box-shadow:
        0 0 12px
        rgba(0,217,255,.5);
}

.key-input::placeholder{

    color:#78909c;
}


/* =========================
   BUTTON
========================= */

.btn{

    width:100%;

    padding:14px;

    margin-top:8px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            90deg,
            #0077b6,
            #00c6ff
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.btn:active{

    transform:scale(.97);
}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:24px;

    margin-top:13px;

    text-align:center;

    color:#ff5368;

    font-size:14px;

    font-weight:bold;
}

.success{

    color:#00ffb3;
}


/* =========================
   GAMES
========================= */

.games{

    display:none;

    margin-top:17px;
}


.game{

    width:100%;

    padding:15px;

    margin-top:10px;

    border-radius:13px;

    border:1px solid #00d9ff;

    background:#07192c;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.game:active{

    transform:scale(.97);
}


/* =========================
   FEATURE PANEL
========================= */

.feature-panel{

    display:none;

    position:fixed;

    right:20px;
    bottom:105px;

    width:270px;

    padding:18px;

    border-radius:20px;

    border:1px solid #00d9ff;

    background:
        rgba(3,12,25,.97);

    box-shadow:
        0 0 30px
        rgba(0,217,255,.5),

        inset 0 0 20px
        rgba(0,150,255,.08);

    z-index:999;

    animation:featureIn .25s ease;
}

@keyframes featureIn{

    from{

        opacity:0;

        transform:
            translateY(20px)
            scale(.85);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   FEATURE TITLE
========================= */

.feature-title{

    text-align:center;

    color:#00d9ff;

    font-size:19px;

    font-weight:900;

    letter-spacing:3px;

    padding-bottom:15px;

    border-bottom:
        1px solid
        rgba(0,217,255,.25);

    text-shadow:
        0 0 10px #00d9ff;
}


/* =========================
   FEATURE ROW
========================= */

.feature-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:16px 4px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    color:white;

    font-size:16px;

    font-weight:bold;
}


/* =========================
   SWITCH
========================= */

.switch{

    position:relative;

    width:52px;
    height:28px;

    flex-shrink:0;
}

.switch input{

    display:none;
}


.slider{

    position:absolute;

    inset:0;

    border-radius:30px;

    background:#263746;

    border:1px solid #506777;

    transition:.25s;

    cursor:pointer;
}


.slider::before{

    content:"";

    position:absolute;

    width:20px;
    height:20px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:white;

    transition:.25s;
}


.switch input:checked + .slider{

    background:#00aee8;

    border-color:#00d9ff;

    box-shadow:
        0 0 15px #00d9ff;
}


.switch input:checked + .slider::before{

    transform:
        translateX(24px);
}


/* =========================
   STATUS
========================= */

.feature-status{

    min-height:20px;

    margin-top:15px;

    text-align:center;

    color:#00ffb3;

    font-size:13px;

    font-weight:bold;
}


/* =========================
   CLOSE BUTTON
========================= */

.close-feature{

    width:100%;

    margin-top:12px;

    padding:10px;

    border:1px solid
        rgba(0,217,255,.5);

    border-radius:10px;

    background:#06192d;

    color:#8eeaff;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;
}

.close-feature:active{

    transform:scale(.97);
}

</style>
</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="glow"></div>


<!-- =========================
     LOGO
========================= -->

<div class="logo" id="logo">

    HVTH PROXY

</div>


<!-- =========================
     START
========================= -->

<button
    class="start"
    id="startBtn">

    BẮT ĐẦU

</button>


<!-- =========================
     FLOAT MENU
========================= -->

<button
    class="float"
    id="floatBtn">

    ☰

</button>


<!-- =========================
     OVERLAY
========================= -->

<div
    class="overlay"
    id="overlay">
</div>


<!-- =========================
     MAIN PANEL
========================= -->

<div
    class="panel"
    id="panel">

    <h2>
        HVTH PROXY
    </h2>


    <input
        id="keyInput"
        class="key-input"
        type="text"
        placeholder="Nhập key..."
        autocomplete="off"
    >


    <button
        class="btn"
        id="getKey">

        GET KEY

    </button>


    <button
        class="btn"
        id="checkKey">

        XÁC NHẬN KEY

    </button>


    <div
        class="message"
        id="message">
    </div>


    <!-- =====================
         GAME BUTTONS
    ====================== -->

    <div
        class="games"
        id="games">


        <button
            class="game"
            onclick="selectGame('max')">

            🎮 FREE FIRE MAX

        </button>


        <button
            class="game"
            onclick="selectGame('th')">

            🎮 FREE FIRE TH

        </button>


    </div>

</div>


<!-- =========================
     FEATURE MENU
========================= -->

<div
    class="feature-panel"
    id="featurePanel">


    <div class="feature-title">

        HVTH PROXY

    </div>


    <!-- AIM NECK -->

    <div class="feature-row">

        <span>
            Aim neck
        </span>


        <label class="switch">

            <input
                type="checkbox"
                id="aimNeck">

            <span class="slider"></span>

        </label>

    </div>


    <!-- ESP MOCO -->

    <div class="feature-row">

        <span>
            Esp moco
        </span>


        <label class="switch">

            <input
                type="checkbox"
                id="espMoco">

            <span class="slider"></span>

        </label>

    </div>


    <!-- STATUS -->

    <div
        class="feature-status"
        id="featureStatus">

    </div>


    <!-- CLOSE -->

    <button
        class="close-feature"
        id="closeFeature">

        ĐÓNG MENU

    </button>


</div>



<script>

/* =========================
   CONFIG
========================= */

const VALID_KEY =
    "HVTH-PROXY-7812";


const GET_KEY_URL =
    "https://link4m.org/HPQEIsnw";


/* =========================
   ELEMENTS
========================= */

const startBtn =
    document.getElementById("startBtn");


const floatBtn =
    document.getElementById("floatBtn");


const logo =
    document.getElementById("logo");


const panel =
    document.getElementById("panel");


const overlay =
    document.getElementById("overlay");


const keyInput =
    document.getElementById("keyInput");


const getKey =
    document.getElementById("getKey");


const checkKey =
    document.getElementById("checkKey");


const message =
    document.getElementById("message");


const games =
    document.getElementById("games");


const featurePanel =
    document.getElementById("featurePanel");


const aimNeck =
    document.getElementById("aimNeck");


const espMoco =
    document.getElementById("espMoco");


const featureStatus =
    document.getElementById("featureStatus");


const closeFeature =
    document.getElementById("closeFeature");


/* =========================
   START
========================= */

startBtn.onclick =
function(){

    logo.style.display =
        "none";

    startBtn.style.display =
        "none";

    floatBtn.style.display =
        "block";

    openMainPanel();

};


/* =========================
   FLOAT BUTTON
========================= */

floatBtn.onclick =
function(){

    /*
       Bấm nút nổi mới hiện
       menu chức năng
    */

    if(
        featurePanel.style.display
        === "block"
    ){

        closeFeatureMenu();

    }else{

        openFeatureMenu();

    }

};


/* =========================
   MAIN PANEL
========================= */

function openMainPanel(){

    panel.style.display =
        "block";

    overlay.style.display =
        "block";


    const savedKey =
        localStorage.getItem(
            "hvth_key"
        );


    if(
        savedKey === VALID_KEY
    ){

        keyInput.value =
            savedKey;

        games.style.display =
            "block";

        message.className =
            "message success";

        message.innerHTML =
            "KEY HỢP LỆ";

    }else{

        games.style.display =
            "none";

        message.className =
            "message";

        message.innerHTML =
            "";

    }

}


/* =========================
   OVERLAY
========================= */

overlay.onclick =
function(){

    panel.style.display =
        "none";

    overlay.style.display =
        "none";

};


/* =========================
   GET KEY
========================= */

getKey.onclick =
function(){

    window.location.href =
        GET_KEY_URL;

};


/* =========================
   CHECK KEY
========================= */

checkKey.onclick =
function(){

    const key =
        keyInput.value.trim();


    if(
        key === VALID_KEY
    ){

        localStorage.setItem(
            "hvth_key",
            key
        );


        message.className =
            "message success";


        message.innerHTML =
            "KEY HỢP LỆ";


        games.style.display =
            "block";


    }else{

        localStorage.removeItem(
            "hvth_key"
        );


        games.style.display =
            "none";


        message.className =
            "message";


        message.innerHTML =
            "KEY KHÔNG ĐÚNG HOẶC ĐÃ HẾT HẠN";

    }

};


/* =========================
   SELECT GAME
========================= */

function selectGame(type){

    /*
       Sau khi chọn FF MAX
       hoặc FF TH:

       1. Đóng panel key
       2. Đóng overlay
       3. Hiện nút menu nổi
       4. Chưa hiện chức năng
    */


    panel.style.display =
        "none";

    overlay.style.display =
        "none";


    floatBtn.style.display =
        "block";


    featurePanel.style.display =
        "none";


    featureStatus.innerHTML =
        "";


    if(type === "max"){

        console.log(
            "Đã chọn Free Fire MAX"
        );

    }


    if(type === "th"){

        console.log(
            "Đã chọn Free Fire TH"
        );

    }

}


/* =========================
   OPEN FEATURE MENU
========================= */

function openFeatureMenu(){

    featurePanel.style.display =
        "block";


    loadFeatureState();

}


/* =========================
   CLOSE FEATURE MENU
========================= */

function closeFeatureMenu(){

    featurePanel.style.display =
        "none";

}


/* =========================
   CLOSE BUTTON
========================= */

closeFeature.onclick =
function(){

    closeFeatureMenu();

};


/* =========================
   AIM NECK
========================= */

aimNeck.onchange =
function(){

    if(this.checked){

        localStorage.setItem(
            "aim_neck",
            "on"
        );


        featureStatus.innerHTML =
            "Đã kích hoạt chức năng Aim neck";

    }else{

        localStorage.setItem(
            "aim_neck",
            "off"
        );


        featureStatus.innerHTML =
            "Đã tắt chức năng Aim neck";

    }

};


/* =========================
   ESP MOCO
========================= */

espMoco.onchange =
function(){

    if(this.checked){

        localStorage.setItem(
            "esp_moco",
            "on"
        );


        featureStatus.innerHTML =
            "Đã kích hoạt chức năng Esp moco";

    }else{

        localStorage.setItem(
            "esp_moco",
            "off"
        );


        featureStatus.innerHTML =
            "Đã tắt chức năng Esp moco";

    }

};


/* =========================
   LOAD STATE
========================= */

function loadFeatureState(){

    const aimState =
        localStorage.getItem(
            "aim_neck"
        );


    const espState =
        localStorage.getItem(
            "esp_moco"
        );


    aimNeck.checked =
        aimState === "on";


    espMoco.checked =
        espState === "on";

}


/* =========================
   SERVICE WORKER
========================= */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register("./sw.js")
                .catch(
                    function(error){

                        console.log(
                            "Service Worker lỗi:",
                            error
                        );

                    }
                );

        }
    );

}

</script>

</body>
        </html>
