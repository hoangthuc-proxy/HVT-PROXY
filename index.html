
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SETTUP+SEETTING FREE FIRE HOANGTHUC</title>

<link rel="icon" href="./icon.png">
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#080d1b">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080d1b url("./bg.png") center/cover fixed;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
        135deg,
        rgba(0,245,212,.12),
        rgba(10,10,30,.92),
        rgba(255,60,172,.12)
    );
    pointer-events: none;
}

.menu {
    position: relative;
    width: 100%;
    max-width: 430px;
    padding: 24px;
    border: 1px solid #00f5d4;
    border-radius: 25px;
    background: rgba(8,15,32,.95);
    box-shadow:
        0 0 20px #00f5d455,
        0 0 60px #00f5d422;
    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    background: linear-gradient(135deg,#00f5d4,#536dfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #06101c;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 0 20px #00f5d477;
}

.online {
    color: #00f5d4;
    font-size: 11px;
    letter-spacing: 2px;
}

h1 {
    font-size: 25px;
    line-height: 1.3;
    margin-top: 25px;
    text-align: center;
    text-shadow: 0 0 15px #00f5d477;
}

h1 span {
    color: #00f5d4;
}

.subtitle {
    text-align: center;
    color: #8194b7;
    font-size: 11px;
    margin: 10px 0 25px;
    letter-spacing: 2px;
}

.line {
    height: 1px;
    background: linear-gradient(90deg,transparent,#00f5d4,transparent);
    margin-bottom: 20px;
}

.feature {
    background: linear-gradient(120deg,#111e35,#10172a);
    border: 1px solid #293a59;
    border-radius: 15px;
    padding: 16px;
    margin-bottom: 13px;
    transition: .3s;
}

.feature.active {
    border-color: #00f5d4;
    box-shadow: 0 0 20px #00f5d433;
}

.feature-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.feature-name {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: .5px;
}

.feature-desc {
    font-size: 10px;
    color: #8092b2;
    margin-top: 5px;
}

.switch {
    width: 52px;
    height: 28px;
    border: none;
    border-radius: 30px;
    background: #34415b;
    padding: 4px;
    cursor: pointer;
    transition: .3s;
}

.switch::before {
    content: "";
    display: block;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    transition: .3s;
}

.switch.on {
    background: #00f5d4;
    box-shadow: 0 0 15px #00f5d4;
}

.switch.on::before {
    transform: translateX(24px);
    background: #071323;
}

.status {
    display: none;
    margin-top: 12px;
    font-size: 11px;
    color: #00f5d4;
}

.status.show {
    display: block;
}

.progress {
    height: 5px;
    background: #293650;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg,#00f5d4,#ff3cac);
    box-shadow: 0 0 12px #00f5d4;
    transition: width .08s linear;
}

.download {
    display: block;
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    margin-top: 15px;
    background: linear-gradient(90deg,#00f5d4,#536dfe);
    color: #071323;
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
    transition: .3s;
}

.download:active {
    transform: scale(.96);
}

.footer {
    text-align: center;
    color: #667895;
    font-size: 10px;
    margin-top: 20px;
    line-height: 1.7;
}

.version {
    display: inline-block;
    padding: 5px 10px;
    border: 1px solid #00f5d455;
    border-radius: 20px;
    color: #00f5d4;
    font-size: 10px;
}
</style>
</head>

<body>

<div class="menu">

    <div class="header">
        <div>
            <div class="online">● HOANGTHUC SYSTEM</div>
            <div style="font-size:10px;color:#8194b7;margin-top:5px">
                FREE FIRE CONTROL PANEL
            </div>
        </div>

        <div class="logo">HT</div>
    </div>

    <h1>
        SETTUP+SEETTING<br>
        <span>FREE FIRE HOANGTHUC</span>
    </h1>

    <div class="subtitle">
        PREMIUM GAMING INTERFACE
    </div>

    <div class="line"></div>

    <div id="features"></div>

    <button class="download" onclick="downloadMenu()">
        ↓ TẢI MENU VỀ MÁY
    </button>

    <div class="footer">
        <span class="version">VERSION 1.0</span>
        <br><br>
        DESIGNED BY HOANGTHUC<br>
        NEON INTERFACE • ANIMATION • LOADING
    </div>

</div>

<script>
const features = [
    {
        name: "TĂNG FPS",
        desc: "FPS BOOST SYSTEM"
    },
    {
        name: "BUFF MƯỢT MÀN",
        desc: "SMOOTH DISPLAY"
    },
    {
        name: "NHẸ MÀN",
        desc: "LIGHT SCREEN MODE"
    },
    {
        name: "KHÔNG NỞ TÂM",
        desc: "CROSSHAIR MODE"
    }
];

const container = document.getElementById("features");

features.forEach((feature, index) => {

    const box = document.createElement("div");
    box.className = "feature";

    box.innerHTML = `
        <div class="feature-top">
            <div>
                <div class="feature-name">${feature.name}</div>
                <div class="feature-desc">${feature.desc}</div>
            </div>

            <button class="switch"
                aria-label="Bật hoặc tắt ${feature.name}"
                aria-pressed="false">
            </button>
        </div>

        <div class="status">
            <span class="status-text">Đang xử lý 0%</span>
            <div class="progress">
                <div class="progress-fill"></div>
            </div>
        </div>
    `;

    container.appendChild(box);

    const btn = box.querySelector(".switch");
    const status = box.querySelector(".status");
    const text = box.querySelector(".status-text");
    const fill = box.querySelector(".progress-fill");

    let enabled = false;
    let busy = false;

    btn.addEventListener("click", () => {

        if (busy) return;

        busy = true;

        const target = !enabled;
        let percent = 0;

        btn.disabled = true;
        status.classList.add("show");

        text.textContent = target
            ? "ĐANG BẬT 0%"
            : "ĐANG TẮT 0%";

        const timer = setInterval(() => {

            percent = Math.min(
                100,
                percent + Math.random() * 12 + 4
            );

            fill.style.width = percent + "%";

            text.textContent =
                (target ? "ĐANG BẬT " : "ĐANG TẮT ")
                + Math.floor(percent) + "%";

            if (percent >= 100) {

                clearInterval(timer);

                enabled = target;

                btn.classList.toggle("on", enabled);
                box.classList.toggle("active", enabled);

                btn.setAttribute(
                    "aria-pressed",
                    String(enabled)
                );

                text.textContent = enabled
                    ? "✓ ĐÃ BẬT THÀNH CÔNG"
                    : "✓ ĐÃ TẮT THÀNH CÔNG";

                btn.disabled = false;
                busy = false;

                setTimeout(() => {
                    status.classList.remove("show");
                    fill.style.width = "0%";
                }, 1800);
            }

        }, 60);
    });
});

function downloadMenu() {

    const content =
        "<!DOCTYPE html>\n" +
        document.documentElement.outerHTML;

    const blob = new Blob(
        [content],
        {type: "text/html;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "HOANGTHUC-FREEFIRE.html";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
}

if ("serviceWorker" in navigator &&
    location.protocol.startsWith("http")) {

    navigator.serviceWorker
        .register("./sw.js")
        .catch(() => {});
}
</script>

</body>
</html>
